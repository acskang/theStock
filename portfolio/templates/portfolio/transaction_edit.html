{% extends 'portfolio/base.html' %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h4 class="mb-3">거래 수정</h4>
  <form method="post">{% csrf_token %}
    <div class="row g-3">{% for field in form %}<div class="col-md-4">{{ field.label_tag }}{{ field }}</div>{% endfor %}</div>
    <button class="btn btn-primary mt-3">저장</button>
  </form>
</div></div>
{% endblock %}
